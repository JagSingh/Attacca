name: Attacca
options:
  bundleIdPrefix: com.jagmsingh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    exactVersion: 0.14.0          # pinned: 0.x releases can change API
targets:
  Attacca:
    type: application
    platform: iOS
    sources: [Attacca]
    scheme: {}                     # shared scheme so xcodebuild -scheme works in CI
    dependencies:
      - package: SFBAudioEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jagmsingh.attacca
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Attacca
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"   # keep SFBAudioEngine's self-registering decoders
        INFOPLIST_KEY_NSHumanReadableCopyright: "(c) 2026 jag.m.singh@gmail.com"
    info:
      path: Attacca/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
