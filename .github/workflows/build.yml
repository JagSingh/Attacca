name: Build unsigned IPA

# - push to main     -> dev build, published as a PRE-RELEASE "build-N"
# - push a tag v*    -> versioned build, published as the LATEST release "vX.Y.Z"
#   (the stable phone link .../releases/latest/download/Attacca.ipa follows tags only)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed to publish GitHub Releases

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1   # same toolchain SFBAudioEngine's own CI uses
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true"              >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/.*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
            echo "version=${v:-0.0.0}"          >> "$GITHUB_OUTPUT"
            echo "is_release=false"             >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild \
            -project Attacca.xcodeproj \
            -scheme Attacca \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Attacca.app Payload/
          zip -qry Attacca.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Attacca-ipa
          path: Attacca.ipa
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.ver.outputs.is_release }}" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" Attacca.ipa \
              --repo "${{ github.repository }}" \
              --title "Attacca ${{ steps.ver.outputs.version }}" \
              --generate-notes \
              --latest
          else
            gh release create "build-${{ github.run_number }}" Attacca.ipa \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Attacca dev build ${{ github.run_number }} (${{ steps.ver.outputs.version }})" \
              --notes "Commit ${{ github.sha }}" \
              --prerelease
          fi
